<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灯台</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070f; color: #cfd6e6; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  canvas { display: block; background: #05070f; max-width: 100vw; max-height: 100vh; }
  #hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 12px; opacity: .55; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>
  <div id="hint">← → か A / D で光を回す。マウスでも向けられる。</div>
</div>
<script src="game.js"></script>
</body>
</html>
